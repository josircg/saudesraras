{% load i18n %}

{% load static %}
{% load i18n %}

<link rel="stylesheet" href="{% static 'site/css/cookie_consent.css' %}">

<div id="cookieConsent">
    <span>
        {% trans 'Este site utiliza cookies.' %} 
        <a href="{% url 'privacy' %}" target="_blank">{% trans 'Mais informações'%}</a>.
    </span>
    
    <div id="closeCookieConsent">x</div>
    
    <a class="cookieConsentOK" href="javascript:Cookielaw.createCookielawCookie();">
        {% trans "Tudo bem" %}
    </a>
</div>

<script type="text/javascript" src="{% static 'site/js/jquery.min.js' %}"></script>
<script>
$(document).ready(function(){   
    setTimeout(function () {
        $("#cookieConsent").fadeIn(200);
     }, 1000);
    $("#closeCookieConsent, .cookieConsentOK").click(function() {
        $("#cookieConsent").fadeOut(200);
    }); 
});
</script>
