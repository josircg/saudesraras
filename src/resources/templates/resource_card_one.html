{% load static %}
{% load i18n %}
{% load l10n %}
{% load thumbnail eucs_platform_tags eucs_platform_translate %}

<div class="col-lg-3 col-sm-6 col-xs-12 mb-5">
    <div class="card h-100 border-0 rounded overflow-hidden shadow-sm card-hover-overlay resource-card cursor-pointer">
        
        <div class="position-relative d-block h-100">
            
            <img class="w-100 h-100 object-fit-contain lazyload resource-img" 
                data-src="{% thumbnail resource.image1|safe_image 400x565 %}" 
                alt="{{ resource.name }}" />
                        
            <div class="card-img-overlay d-flex flex-column justify-content-center align-items-center text-center p-4 overlay-blur-dark">
                
                {% if resource.featured %}
                <span class="badge bg-warning text-dark mb-2">Featured</span>
                {% endif %}

                <h4 class="text-white fw-bold mb-3">
                    {{ resource.name | truncatewords:8 }}
                </h4>

                <p class="text-light small mb-4">
                    {{ resource.abstract | safe | truncate_summary:20 }}
                </p>

                <div class="d-grid gap-2 w-100 px-3">
                    <a class="btn btn-blue3 btn-sm fw-semibold rounded-pill" href="/resource/{{resource.id}}">
                        Saiba mais...
                    </a>
                </div>
            </div>
        </div>

    </div>
</div>
