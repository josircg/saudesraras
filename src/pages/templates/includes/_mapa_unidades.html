{% load i18n %}
{% load static %}

<!-- Leaflet CSS & JS -->
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>

<!-- CONTÊINER DO MAPA -->
<div class="row mb-4">
    <div class="col-12">
        <div id="map-unidades" 
             style="height: 400px; width: 100%; border-radius: 20px; z-index: 1;" 
             class="border shadow-sm">
        </div>
    </div>
</div>

<!-- CARDS DE UNIDADES -->
{% if artigos_list %}
    <div class="row g-3 justify-content-center">
        {% for artigo in artigos_list %}
            <div class="col-md-4 col-sm-6 col-12 d-flex justify-content-center">
                <div class="card-wrapper m-2" style="height:450px; width: 100%; max-width: 400px;">
                    <div class="card" style="height:450px; width: 100%; border-radius: 30px; border: none; position: relative; overflow: hidden; background-color: #5CDCFF; box-sizing: border-box;">
                        
                        <!-- Imagem Grafismo Centralizada como Marca d'água -->
                        <img src="/media/logo.png" 
                             alt="Marca d'água" 
                             style="position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%); width: 70%; height: auto; opacity: 0.2; z-index: 1; pointer-events: none;">

                        <!-- Corpo do Card -->
                        <div class="card-body d-flex flex-column justify-content-between" style="position: relative; z-index: 2; padding: 6%; box-sizing: border-box; height: 100%;">
                            <div>
                                <h5 class="card-title bld azul-escuro mb-1" style="font-size: clamp(16px, 2.5vw, 22px); line-height: 1.2;">
                                    {{ artigo.title }}
                                </h5>

                                {% if artigo.header %}
                                    <p class="fw-bold azul-escuro bld small mb-1" style="font-size: clamp(12px, 2vw, 15px);">
                                        {{ artigo.header|safe }}
                                    </p>
                                {% endif %}

                                <p class="card-text azul-escuro mb-2" style="font-size: clamp(16px, 2.5vw, 18px); line-height: 1.3; color:black !important;">
                                    {{ artigo.content|safe }}
                                </p>
                            </div>

                            <div class="d-flex flex-column gap-2 mt-auto pt-2 w-100">
                                <button type="button" 
                                        class="btn btn-blue5 rounded-pill fw-bold w-100 d-inline-flex align-items-center justify-content-center py-2" 
                                        style="font-size: 13px;"
                                        onclick="focusOnMap('{{ artigo.id }}')">
                                    <i class="fas fa-map-marker-alt me-2"></i> {% trans "Ver no mapa" %}
                                </button>

                                <a href="#"
                                   onclick="openRoute(`{{ artigo.content|safe|escapejs }}`); return false;"
                                   class="btn btn-blue5-outline rounded-pill fw-bold w-100 d-inline-flex align-items-center justify-content-center py-2 text-decoration-none"
                                   style="font-size: 13px;">
                                    <i class="fas fa-directions me-2"></i>
                                    {% trans "Ver rota" %}
                                </a>
                            </div>
                        </div>

                    </div>
                </div>
            </div>
        {% endfor %}
    </div>
{% endif %}

<!-- SCRIPT COMPLETO DO MAPA -->
<script>
    function openRoute(htmlAddress) {
        const div = document.createElement("div");
        div.innerHTML = htmlAddress;
        const address = div.textContent.trim();

        window.open(
            "https://www.google.com/maps/search/?api=1&query=" + encodeURIComponent(address),
            "_blank"
        );
    }

    document.addEventListener("DOMContentLoaded", function () {
        const mapContainer = document.getElementById("map-unidades");
        if (!mapContainer) return;

        // Reset do mapa caso já exista uma instância no container
        if (mapContainer._leaflet_id) {
            mapContainer._leaflet_id = null;
        }

        // 1. Inicialização do Mapa
        const map = L.map("map-unidades").setView([-22.5000, -42.8000], 8);

        L.tileLayer(
            "https://{s}.tile.openstreetmap.fr/osmfr/{z}/{x}/{y}.png",
            {
                maxZoom: 20,
                attribution: '&copy; OpenStreetMap France | &copy; <a href="https://www.openstreetmap.org/copyright">OpenStreetMap</a>'
            }
        ).addTo(map);

        // Força a renderização imediata do container
        map.invalidateSize();
        setTimeout(() => map.invalidateSize(), 300);

        // 2. Destaque do Estado do Rio de Janeiro
        const rjGeoJSONUrl = "https://raw.githubusercontent.com/giuliano-macedo/geodata-br-states/main/geojson/br_states/br_rj.json";

        map.createPane("mascaraRJ");
        map.getPane("mascaraRJ").style.zIndex = 350;
        map.getPane("mascaraRJ").style.pointerEvents = "none";

        map.createPane("contornoRJ");
        map.getPane("contornoRJ").style.zIndex = 450;
        map.getPane("contornoRJ").style.pointerEvents = "none";

        fetch(rjGeoJSONUrl)
            .then(response => {
                if (!response.ok) throw new Error("Erro ao carregar contorno do RJ: " + response.status);
                return response.json();
            })
            .then(geoData => {
                const polygons = [];

                function extractGeometry(geometry) {
                    if (!geometry) return;
                    if (geometry.type === "Polygon") {
                        polygons.push(geometry.coordinates);
                    } else if (geometry.type === "MultiPolygon") {
                        geometry.coordinates.forEach(polygon => polygons.push(polygon));
                    } else if (geometry.type === "GeometryCollection") {
                        geometry.geometries.forEach(extractGeometry);
                    }
                }

                if (geoData.type === "FeatureCollection") {
                    geoData.features.forEach(feature => extractGeometry(feature.geometry));
                } else if (geoData.type === "Feature") {
                    extractGeometry(geoData.geometry);
                } else {
                    extractGeometry(geoData);
                }

                if (!polygons.length) throw new Error("Nenhum polígono encontrado no GeoJSON do RJ.");

                const worldRing = [
                    [-85, -179.99],
                    [-85, 179.99],
                    [85, 179.99],
                    [85, -179.99],
                    [-85, -179.99]
                ];

                const maskRings = [worldRing];
                polygons.forEach(polygon => {
                    const outerRing = polygon[0].map(coord => [coord[1], coord[0]]);
                    maskRings.push(outerRing);
                });

                L.polygon(maskRings, {
                    pane: "mascaraRJ",
                    stroke: false,
                    fillColor: "#111827",
                    fillOpacity: 0.85,
                    fillRule: "evenodd",
                    interactive: false
                }).addTo(map);

                const rjLayer = L.geoJSON(geoData, {
                    pane: "contornoRJ",
                    style: {
                        color: "#0066ff",
                        weight: 4,
                        opacity: 1,
                        fillColor: "#0088ff",
                        fillOpacity: 0.06,
                        interactive: false
                    }
                }).addTo(map);

                const rjBounds = rjLayer.getBounds();
                if (rjBounds.isValid()) {
                    map.fitBounds(rjBounds, {
                        padding: [30, 30],
                        maxZoom: 9
                    });
                }

                setTimeout(() => map.invalidateSize(), 300);
            })
            .catch(error => console.error("Erro ao aplicar destaque do RJ:", error));

        // 3. Marcadores e Geocoding
        const defaultIcon = L.icon({
            iconUrl: "{% static 'site/icons/icon-loc.png' %}",
            iconSize: [80, 80],
            iconAnchor: [40, 80],
            popupAnchor: [0, -38],
            tooltipAnchor: [20, -35]
        });

        window.unitMarkers = {};
        const bounds = L.latLngBounds();
        const sleep = ms => new Promise(resolve => setTimeout(resolve, ms));

        function addMarker(articleId, lat, lon, unitName, decodedAddress, extraInfo) {
            if (window.unitMarkers[articleId]) return;

            const marker = L.marker([lat, lon], { icon: defaultIcon }).addTo(map);

            let popup = `
                <div style="min-width:240px">
                    <h6 style="margin-bottom:10px;font-weight:bold;">${unitName}</h6>
                    <div style="margin-bottom:8px;">📍 ${decodedAddress}</div>
            `;

            if (extraInfo.length) {
                popup += "<hr style='margin:8px 0'>";
                extraInfo.forEach(info => {
                    popup += `<div>${info}</div>`;
                });
            }

            popup += "</div>";

            marker.bindPopup(popup);
            marker.bindTooltip(unitName);

            window.unitMarkers[articleId] = { lat, lng: lon, marker };
            bounds.extend([lat, lon]);
        }

        const geocodeQueue = [];

        {% for artigo in artigos_list %}
        (function () {
            const articleId = "{{ artigo.id }}";
            const unitName = "{{ artigo.header|default:artigo.title|escapejs }}";

            let rawCity = "{{ artigo.title|escapejs }}";
            let unitCity = rawCity.split("-")[0].trim();

            const rawContent = `{{ artigo.content|safe|striptags|escapejs }}`;

            const lines = rawContent
                .split(/\r?\n/)
                .map(l => l.trim())
                .filter(l => l.length);

            const address = lines[0] || rawContent.trim();
            const extraInfo = lines.slice(1);

            const decoder = document.createElement("textarea");
            decoder.innerHTML = address;
            const decodedAddress = decoder.value;

            const cepMatch = decodedAddress.match(/\b\d{5}-?\d{3}\b/);
            const rawCep = cepMatch ? cepMatch[0] : null;

            let fullAddressClean = decodedAddress
                .replace(/\bR\.\b/gi, "Rua")
                .replace(/\bAv\.\b/gi, "Avenida")
                .replace(/\bP&ccedil;a\b|\bPça\b/gi, "Praça")
                .replace(/,\s*,/g, ",")
                .replace(/\s+/g, " ")
                .trim();

            let addressWithoutCep = fullAddressClean
                .replace(/CEP[: ]*\d{5}-?\d{3}/gi, "")
                .replace(/\b\d{5}-\d{3}\b/g, "")
                .trim()
                .replace(/,\s*$/, "");

            let streetOnly = addressWithoutCep
                .split(",")[0]
                .split("-")[0]
                .replace(/\d+/, "")
                .trim();

            const queries = [];
            queries.push(`${fullAddressClean}, Brasil`);
            queries.push(`${addressWithoutCep}, Brasil`);

            if (streetOnly.length > 3) {
                queries.push(`${streetOnly}, ${unitCity}, RJ, Brasil`);
            }

            if (rawCep) {
                queries.push(`${rawCep}, Brasil`);
            }

            queries.push(`${unitCity}, RJ, Brasil`);

            geocodeQueue.push({
                articleId,
                unitName,
                decodedAddress,
                extraInfo,
                queries
            });
        })();
        {% endfor %}

        async function processGeocodeQueue() {
            for (const item of geocodeQueue) {
                let found = false;

                for (const query of item.queries) {
                    try {
                        const response = await fetch(
                            "https://nominatim.openstreetmap.org/search?format=json&limit=1&q=" +
                            encodeURIComponent(query)
                        );

                        if (!response.ok) throw new Error(`HTTP ${response.status} no geocoding`);

                        const data = await response.json();

                        if (data && data.length > 0) {
                            addMarker(
                                item.articleId,
                                parseFloat(data[0].lat),
                                parseFloat(data[0].lon),
                                item.unitName,
                                item.decodedAddress,
                                item.extraInfo
                            );
                            found = true;
                            break;
                        }
                    } catch (e) {
                        console.error("Erro ao geocodificar:", e);
                    }

                    await sleep(1000);
                }

                if (!found) {
                    console.warn("Nenhum resultado para:", item.unitName);
                }

                await sleep(1000);
            }
        }

        processGeocodeQueue();

        // 4. Focar em uma Unidade
        window.focusOnMap = function (articleId) {
            const target = window.unitMarkers[articleId];

            if (!target) {
                alert("{% trans 'Aguarde o carregamento do mapa ou verifique o endereço.' %}");
                return;
            }

            mapContainer.scrollIntoView({
                behavior: "smooth",
                block: "center"
            });

            map.flyTo(
                [target.lat, target.lng],
                16,
                {
                    animate: true,
                    duration: 1.2
                }
            );

            target.marker.openPopup();
        };
    });
</script>
