{% load i18n %}
{% load static %}

{% for post in sections %}
<div class="col-12 mb-4">
    <div class="row my-2 p-3 border rounded shadow-sm bg-white align-items-center">
        
        <div class="col-12">
            
            <h3 style="white-space: nowrap; overflow: hidden; text-overflow: ellipsis;" title="{{ post.title }}">
                {{ post.title }}
            </h3> 
            
            <div class="text-muted mb-3" style="display: -webkit-box; -webkit-line-clamp: 3; -webkit-box-orient: vertical; overflow: hidden; text-overflow: ellipsis; font-size: 15px;">
                {{ post.header|default:post.content|striptags|safe }}
            </div>
            
            <div class="mt-3 mb-0">
                <a class="btn btn-blue3 text-white px-4" href="{% url 'section_detail' page_slug=page.slug section_id=post.id %}" style="background-color: #0d6efd;">
                    {% trans "Acessar página" %}
                </a>
            </div>
        </div>

    </div>
</div>
{% endfor %}

{% if sections.has_other_pages %}
<div class="col-12 mt-4">
    </div>
{% endif %}
