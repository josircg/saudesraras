{% load i18n %}
{% load static %}
{% load thumbnail %}

<div class="row my-4" style="height: 288px; max-height: 288px; overflow: hidden;">
    <div class="col-sm-4 p-0 h-100">
        <div class="col-md-3 p-0 w-100 h-100">
            <img class="card-img lazyload h-100 w-100"
                style="border-radius: 15px; object-fit: cover;"    
                data-src="{% thumbnail post.safe_image|default:'void_600.png' 600x400 upscale crop %}"
                alt="Card image">
        </div>
    </div>
    
    <div class="col-sm-8 py-2 col-12 mt-0 mb-0 h-100 d-flex flex-column justify-content-between">
        
        <div style="overflow: hidden;">
            <h3 style="color: #114D7F; font-size: 32px; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; text-overflow: ellipsis; margin-bottom: 0.25rem;">
                {{ post.title }}
            </h3> 

            <p class="small text-muted mb-2">
                {% if post.author.name != "Empty user" %}
                    {{ post.author.name }},
                {% endif %}
                {{ post.created_on }}
            </p>

            <div style="font-size: 20px; line-height: 1.35; display: -webkit-box; -webkit-line-clamp: 4; -webkit-box-orient: vertical; overflow: hidden; text-overflow: ellipsis;">
                {{ post.excerpt | safe }}
            </div>
        </div>
        
        <div class="mt-2 mb-0">
            <a class="btn btn-blue3" href="{{ post.get_absolute_url }}" target="_blank">
                {% trans "Access page" %}
            </a>
        </div>

    </div>
</div>
