{% load i18n %}
{% load static %}
{% load thumbnail %}

        
    <div class="row my-2">
         <div class="col-sm-2 p-0">
            <div class="col-md-3 p-0 w-100" >
                <img class="card-img lazyload"
                    data-src="{% thumbnail post.safe_image|default:'void_600.png' 600x400 upscale crop %}"
                    alt="Card image">
            </div>
        </div>
        <div class="col-sm-3 col-12 mt-0 mb-0 text-blue3">
            
            <h3>{{post.title}}</h3> 
            <p class="small text-muted">
                {% if post.author.name != "Empty user" %}
                {{ post.author.name }},
                {% endif %}
                {{ post.created_on}}
            </p>
        </div>
        <div class="col-sm-6 col-12 mt-0 mb-0">
            {{ post.excerpt | safe }}
            <div class="mt-3 mb-0">
                <a class="btn btn-blue3" href="{{ post.get_absolute_url }}" target="_blank">
                    {% trans "Access page" %}
                </a>
            </div>
        </div>
    </div>
