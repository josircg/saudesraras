{% load i18n %}
{% load static %}
{% load thumbnail %}

    
<div class="row my-2 mx-1">
        <div class="col-lg-4 col-12 p-0">
        <div class="col-md-3 p-0 w-100" >
            <img class="card-img lazyload"
                data-src="{% thumbnail post.safe_image|default:'void_600.png' 600x400 upscale crop %}"
                alt="Card image">
        </div>
    </div>
    
    <div class="col-lg-8 col-12 mt-0 mb-0"> 
        <h3>{{post.title}}</h3>
        <p class="small text-muted">
            {% if post.author.name != "Empty user" %}
            {{ post.author.name }},
            {% endif %}
            {{ post.created_on}}
        </p>
        {{ post.excerpt | safe }}
        <div class="mt-3 mb-0">
            <a class="btn btn-blue3" href="{{ post.get_absolute_url }}" target="_blank">
                {% trans "Access page" %}
            </a>
        </div>
    </div>
</div>
