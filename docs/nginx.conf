upstream gunicorn_saudesraras {
    # Configuração TCP: precisa bater com o --bind do gunicorn no systemd
    # (docs/saudesraras.service usa 127.0.0.1:5000)
    server 127.0.0.1:5000 fail_timeout=0;
}

server {
    listen 80;

    # server_name "_" é um catch-all: aceita qualquer Host (bom para testar
    # por IP ou localhost). Em produção, troque pelo domínio real, ex.:
    #   server_name saudesraras.pro.br www.saudesraras.pro.br;
    server_name _;

    client_max_body_size 20M;

    access_log /var/webapp/saudesraras/logs/nginx-access.log;
    error_log  /var/webapp/saudesraras/logs/nginx-error.log;

    # MEDIA_ROOT = BASE_DIR / "media"  ->  src/media
    location /media/ {
        alias /var/webapp/saudesraras/src/media/;
    }

    # STATIC_ROOT = BASE_DIR.parent / "static"  ->  /var/webapp/saudesraras/static
    # (gerado por: python manage.py collectstatic)
    location /static/ {
        alias /var/webapp/saudesraras/static/;
        expires 30d;
    }

    location / {
        # procura arquivo estático; se não achar, repassa para o app (gunicorn)
        try_files $uri @proxy_to_app;
    }

    location @proxy_to_app {
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Host $http_host;
        proxy_redirect off;
        proxy_read_timeout 600;
        proxy_connect_timeout 600;
        keepalive_timeout 600;
        proxy_pass http://gunicorn_saudesraras;
    }
}
